FUNC_DEF -> EPS
    | FUNCTION LITERAL ORPAR PAR_DEF CRPAR OBRA FUNC_APP CBRA FUNC_DEF;
FUNC_APP -> EPS
    | LITERAL ORPAR PAR_APP CRPAR SEMICOLON FUNC_APP;

PAR_DEF -> EPS
        | TYPE LITERAL
        | TYPE LITERAL COMMA PAR_DEF

PAR_APP -> EPS
        | LITERAL
        | VALUE
        | LITERAL COMMA PAR_APP
        | VALUE COMMA PAR_APP

TYPE -> INTEGER
    | REAL
    | LOGICAL
    | CHARACTER
    | STRING;